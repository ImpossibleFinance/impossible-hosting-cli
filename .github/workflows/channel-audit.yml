name: channel-audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: channel-audit-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'live' || github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository policy files
        run: |
          set -euo pipefail
          bash -n scripts/verify-channel.sh
          bash -n scripts/test-verify-channel.sh
          ssh-keygen -l -f release-signers
          test "$(wc -l < release-signers)" -eq 1
          jq -e '
            .schema == 1 and
            (.build_id | type == "string") and
            (.source_commit | test("^[0-9a-f]{40}$")) and
            (.release_sha256 | test("^[0-9a-f]{64}$"))
          ' channel-state.json >/dev/null
      - name: Exercise server-signed channel verification
        run: scripts/test-verify-channel.sh

  channel:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the last accepted channel state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          for event in schedule workflow_dispatch; do
            runs_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/channel-audit.yml/runs?branch=main&status=success&event=$event&per_page=1"
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              "${api_headers[@]}" "$runs_url" --output "$RUNNER_TEMP/runs-$event.json"
          done
          previous_run=$(
            jq -sr --argjson current "$GITHUB_RUN_ID" '
              [.[].workflow_runs[] | select(.id < $current)] |
              if length == 0 then "" else (max_by(.id).id | tostring) end
            ' "$RUNNER_TEMP/runs-schedule.json" "$RUNNER_TEMP/runs-workflow_dispatch.json"
          )
          if [ -z "$previous_run" ]; then
            cp channel-state.json "$RUNNER_TEMP/previous-channel-state.json"
            exit 0
          fi

          artifacts_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$previous_run/artifacts?per_page=100"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "${api_headers[@]}" "$artifacts_url" --output "$RUNNER_TEMP/artifacts.json"
          archive_url=$(
            jq -r '
              [.artifacts[] | select(.name == "channel-state" and (.expired | not))] |
              if length == 0 then "" else max_by(.id).archive_download_url end
            ' "$RUNNER_TEMP/artifacts.json"
          )
          if [ -z "$archive_url" ]; then
            echo "previous successful live audit has no retained channel checkpoint" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "${api_headers[@]}" "$archive_url" --output "$RUNNER_TEMP/channel-state.zip"
          unzip -p "$RUNNER_TEMP/channel-state.zip" channel-state.json \
            > "$RUNNER_TEMP/previous-channel-state.json"
          test -s "$RUNNER_TEMP/previous-channel-state.json"
      - name: Verify the live release channel
        run: |
          scripts/verify-channel.sh \
            https://host.impossibuild.ai \
            release-signers \
            "$RUNNER_TEMP/previous-channel-state.json" \
            "$RUNNER_TEMP/channel-state.json"
      - name: Preserve the accepted channel state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: channel-state
          path: ${{ runner.temp }}/channel-state.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
